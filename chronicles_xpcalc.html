<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Experience Calculator</title>
<style>
	:root {
		--bg:			#14181fff;
		--panel:		#1c222cff;
		--panel2:		#232a36ff;
		--border:		#2e3644ff;
		--text:			#e8ecf3ff;
		--secondary:	#e8ecf3a9;
		--muted:		#8b95a7ff;
		--accent:		#d4a24cff;
		--accent2:		#5ba3d0ff;
		--good:			#5fb87aff;
		--bad:			#e2695fff;
		--black:		#000000ff;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: 'Segoe UI', 'Tahoma', 'sans-serif';
		background: var(--bg);
		color: var(--text);
		min-height: 100vh;
		padding: 24px;
	}
	h1 {
		color: var(--text);
		text-align: center;
		font-size: 1.5rem;
		margin: 0 0 4px;
		margin-bottom: 30px;
		letter-spacing: .5px;
	}
	.grid2 {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 18px;
		max-width: 1300px;
		margin: 0 auto;
	}
	.grid {
		display: block;
		max-width: 1300px;
		margin: 0 auto;
		padding: 1rem 0px;
	}
	@media(max-width:900px) { .grid { grid-template-columns: 1fr; } }
	.panel {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 4px;
		padding: 16px 18px;
		box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
	}
	.panel h2 {
		font-size: 1.05rem;
		margin: 0 0 12px;
		color: var(--accent);
		display: flex;
		align-items: center;
		gap: 8px;
	}
	.full { grid-column: 1/-1; }
	.center {
		margin: 0 auto 18px;
		width: 50%;
	}
	.field {
		display: flex;
		flex-direction: column;
		gap: 4px;
	}
	label {
		font-size: 1.05rem;
		margin: 0 0 12px;
		color: var(--accent);
		display: flex;
		align-items: center;
		gap: 8px;
		font-weight: 700;
	}
	select,
	input[type=text], input[type=number], select {
		background: var(--panel2);
		border: 1px solid var(--border);
		color: var(--text);
		padding: 7px 9px;
		border-radius: 4px;
		font-size: .9rem;
	}
	input[type=text] { flex: 1; }
	select {
		flex: 1;
		max-width: 100%;
	}
	.results {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
		gap: 12px;
		margin: 1.5rem 0;
	}
	.metric {
		background: var(--surface-1);
		border-radius: var(--radius);
		padding: 1rem;
	}
	.metric-label {
		font-size: 12px;
		color: var(--secondary);
		margin-bottom: 4px;
	}
	.metric-value {
		font-size: 20px;
		font-weight: 500;
		color: var(--text);
	}
	.metric-range {
		font-size: 12px;
		color: var(--secondary);
		margin-top: 2px;
	}
	.metric-sub {
		font-size: 11px;
		color: var(--muted);
		margin-top: 2px;
	}
	.section {
		font-size: 12px;
		font-weight: 500;
		color: var(--secondary);
		text-transform: uppercase;
		letter-spacing: 0.05em;
		margin: 1.25rem 0 0.5rem;
	}
	.quest-table {
		width: 100%;
		border-collapse: collapse;
		font-size: 13px;
	}
	.quest-table th {
		text-align: left;
		padding: 6px 8px;
		color: var(--secondary);
		border-bottom: 0.5px solid var(--border);
		font-weight: 400;
	}
	.quest-table td {
		padding: 6px 8px;
		border-bottom: 0.5px solid var(--border);
		color: var(--text);
	}
	.chart-wrap {
		position: relative;
		width: 100%;
		height: 240px;
		margin: 1rem 0;
	}
	.toggle-row {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-bottom: 0.75rem;
	}
	.toggle-row label {
		margin: 0;
		font-size: 13px;
		color: var(--secondary);
	}
	.badge {
		display: inline-block;
		font-size: 11px;
		padding: 2px 7px;
		border-radius: 99px;
		background: var(--bg-accent);
		color: var(--accent2);
	}
	.warn-note {
		font-size: 12px;
		color: var(--secondary);
		margin: 0.5rem 0 1rem;
		font-style: italic;
	}

	footer {
		text-align: center;
		color: var(--muted);
		font-size: .75rem;
		margin-top: 26px;
		text-shadow: 1px 1px 15px var(--black);
	}
	footer .block-line > span {
		display: inline-block;
	}

	span.block-line {
		-webkit-background-clip: text;
		background-clip: text;
		color: transparent;
		display: inline-block;
		background-image: linear-gradient(90deg,
			#c63939ff,
			#c66839ff,
			#c69739ff,
			#c6c639ff,
			#97c639ff,
			#68c639ff,
			#39c639ff,
			#39c668ff,
			#39c697ff,
			#39c6c6ff,
			#3997c6ff,
			#3968c6ff,
			#3939c6ff,
			#6839c6ff,
			#9739c6ff,
			#c639c6ff,
			#c63997ff,
			#c63968ff,
			#c63939ff
		);
	}
</style>
</head>

<body>

<h1>Elder Scrolls: Chronicles - Experience Calculator</h1>

<div class="panel center">
	<div class="grid2">
		<div class="field">
			<label for="curLevel">Current level</label>
			<input type="number" id="curLevel" min="0" max="19" value="0">
		</div>
		<div class="field">
			<label for="desLevel">Desired level</label>
			<input type="number" id="desLevel" min="1" max="20" value="20">
		</div>
		<div class="field">
			<label for="curXP">Current experience</label>
			<input type="number" id="curXP" min="0" value="0">
		</div>
		<div class="field">
			<label for="crisis">Crisis level</label>
			<input type="number" id="crisis" min="0" value="0">
		</div>
		<div class="field">
			<label for="energy">Energy per day</label>
			<input type="number" id="energy" min="1" max="10" value="3">
		</div>
		<div class="field">
			<label for="wellfed">Well-fed modifier (%)</label>
			<input type="number" id="wellfed" min="50" max="150" value="95">
		</div>
		<div class="field">
			<label for="encDifficulty">Encounter difficulty</label>
			<select id="encDifficulty">
				<option value="Easy">Easy (-2 Difficulty)</option>
				<option value="Medium" selected>Medium (+0 Difficulty)</option>
				<option value="Hard">Hard (+2 Difficulty, +1 Health)</option>
				<option value="Perilous">Perilous (+4 Difficulty, +2 Health)</option>
				<option value="Lethal">Lethal (+6 Difficulty, +3 Health)</option>
			</select>
		</div>
		<div class="field">
			<label for="biome">Biome</label>
			<select id="biome">
				<option value="">- any biome -</option>
			</select>
		</div>
	</div>

	<div id="biomeWarning" class="warn-note" style="display:none"></div>

	<div class="grid">
		<div class="field" style="margin-bottom:.75rem">
			<label for="faction">Faction (optional)</label>
			<select id="faction">
				<option value="">- no faction -</option>
			</select>
		</div>

		<div class="toggle-row">
			<input type="checkbox" id="weeklyXP" checked style="width:auto">
			<label for="weeklyXP">Weekly experience bonus <span class="badge">+150 XP/week</span></label>
		</div>

		<div id="questInfo" style="display:none">
			<div class="section">Faction quests</div>
			<table class="quest-table">
				<thead><tr><th>Quest</th><th>XP reward</th><th>Cooldown</th><th>XP/day avg</th></tr></thead>
				<tbody id="questRows"></tbody>
				<tfoot><tr>
					<td style="padding:6px 8px;font-weight:500">Total</td>
					<td id="totalQuestXP" style="padding:6px 8px;font-weight:500"></td>
					<td></td>
					<td id="totalQuestXPDay" style="padding:6px 8px;font-weight:500;color:var(--accent)"></td>
				</tr></tfoot>
			</table>
		</div>

		<div class="results" id="results"></div>
	</div>
</div>

<footer>
	<span class="block-line">Meow :3</span>
</footer>

<script>
const FACTIONS = {

			{ name: "Clearing the Road",		xp: 50,		cooldown: 3 },

	},

		]

	"City of Kvatch": {

		quests: [

			{ name: "Patrol the Road",			xp: 100,	cooldown: 7 },
		]
	},
	"Mythic Dawn": {
		display: "Mythic Dawn",
		quests: [
			{ name: "A Worthy Offering",		xp: 50,		cooldown: 3 },
			{ name: "Fan the Flames",			xp: 100,	cooldown: 7 },

const XP_THRESHOLDS = [
	{ min: 19,	xp: 1000 },
	{ min: 18,	xp: 700 },
	{ min: 17,	xp: 450 },
	{ min: 15,	xp: 300 },
	{ min: 10,	xp: 150 },
	{ min: 0,	xp: 100 },

const DIFFICULTY_MODIFIERS = {
	Easy:		{ dr: -2,	hp: 0 },
	Medium:		{ dr: 0,	hp: 0 },
	Hard:		{ dr: 2,	hp: 1 },
	Perilous:	{ dr: 4,	hp: 2 },
	Lethal:		{ dr: 6,	hp: 3 },
};

const BIOMES = [
	"Mountains",
	"Jungle",
	"Desert",
	"Cave",
	"Tundra",
	"Forest",
	"Plains",
	"Urban",
	"Ayleid",
	"Dwemer",
	"Oblivion",
	"Aquatic"
];

// Extracted from EnemyDatabase.csv - only "created in-game" biome-taggable
// enemies with actual biome assignments are relevant here. Named/SPECIAL
// bosses (empty biomes[]) are intentionally excluded from any biome filter.
const ENEMIES = [{"name":"Redguard Bandit","health":3,"difficulty":5,"biomes":["Desert","Plains","Urban"]},{"name":"Goblin Thrall","health":1,"difficulty":3,"biomes":["Mountains","Jungle","Desert","Cave","Tundra","Forest","Plains","Urban","Ayleid","Dwemer"]},{"name":"Colovian Bandit","health":2,"difficulty":4,"biomes":["Mountains","Cave","Forest","Plains","Urban"]},{"name":"Hedge Wizard","health":3,"difficulty":5,"biomes":["Mountains","Desert","Cave","Forest","Plains","Urban","Ayleid"]},{"name":"Frost Troll","health":4,"difficulty":5,"biomes":["Mountains","Cave","Tundra"]},{"name":"Orc Warrior","health":3,"difficulty":6,"biomes":["Mountains","Cave","Tundra","Forest"]},{"name":"Khajiit Brigand","health":2,"difficulty":4,"biomes":["Jungle","Desert","Cave","Plains","Urban"]},{"name":"Ice Wraith","health":3,"difficulty":5,"biomes":["Mountains","Cave","Tundra","Ayleid","Aquatic"]},{"name":"Dunmer Raider","health":3,"difficulty":5,"biomes":["Mountains","Cave","Forest","Plains","Urban","Ayleid","Dwemer"]},{"name":"Goblin Mage","health":2,"difficulty":4,"biomes":["Mountains","Jungle","Desert","Cave","Tundra","Forest","Plains","Urban","Ayleid","Dwemer"]},{"name":"Orc Berserker","health":4,"difficulty":8,"biomes":["Mountains","Cave","Tundra","Forest"]},{"name":"Skeleton Warrior","health":2,"difficulty":4,"biomes":["Mountains","Desert","Cave","Tundra","Forest","Plains","Ayleid","Dwemer","Aquatic"]},{"name":"Slaughterfish","health":1,"difficulty":4,"biomes":["Aquatic"]},{"name":"Alphyn","health":5,"difficulty":9,"biomes":["Plains"]},{"name":"Scamp","health":2,"difficulty":6,"biomes":["Oblivion"]},{"name":"Clannfear","health":3,"difficulty":8,"biomes":["Oblivion"]},{"name":"Zombie","health":2,"difficulty":4,"biomes":["Cave","Forest","Ayleid"]},{"name":"Headless Zombie","health":3,"difficulty":5,"biomes":["Cave","Forest","Ayleid"]},{"name":"Dread Zombie","health":4,"difficulty":8,"biomes":["Cave","Forest","Ayleid"]},{"name":"Ghost","health":2,"difficulty":5,"biomes":["Cave","Forest","Ayleid"]},{"name":"Wraith","health":4,"difficulty":8,"biomes":["Cave","Forest","Ayleid"]},{"name":"Breton Mage","health":3,"difficulty":5,"biomes":["Mountains","Jungle","Cave","Forest","Plains","Urban"]},{"name":"Bear","health":6,"difficulty":5,"biomes":["Mountains","Cave","Tundra","Forest"]},{"name":"Dwemer Arquebus","health":3,"difficulty":5,"biomes":["Dwemer"]},{"name":"Dwemer Sphere","health":2,"difficulty":4,"biomes":["Dwemer"]},{"name":"Dwemer Spider","health":1,"difficulty":3,"biomes":["Dwemer"]},{"name":"Dwemer Centurion","health":4,"difficulty":8,"biomes":["Dwemer"]},{"name":"Dwemer Centurion","health":4,"difficulty":8,"biomes":["Dwemer"]},{"name":"Dwemer Colossus","health":6,"difficulty":9,"biomes":["Dwemer"]},{"name":"Spriggan","health":5,"difficulty":6,"biomes":["Forest","Plains"]},{"name":"Hagraven","health":4,"difficulty":6,"biomes":["Cave","Plains"]},{"name":"Giant","health":4,"difficulty":8,"biomes":["Tundra","Forest","Plains"]},{"name":"Wolf","health":2,"difficulty":3,"biomes":["Mountains","Cave","Forest","Plains"]},{"name":"Rat","health":2,"difficulty":1,"biomes":["Cave","Urban"]},{"name":"Mudcrab","health":2,"difficulty":2,"biomes":["Aquatic"]},{"name":"Minotaur","health":4,"difficulty":6,"biomes":["Ayleid"]},{"name":"Flame-Atronach","health":3,"difficulty":5,"biomes":["Oblivion"]},{"name":"Imp","health":2,"difficulty":3,"biomes":["Urban","Ayleid","Oblivion"]},{"name":"Xivilai","health":5,"difficulty":7,"biomes":["Oblivion"]},{"name":"Storm-Atronach","health":4,"difficulty":6,"biomes":["Oblivion"]},{"name":"Will-o-the-Wisp","health":3,"difficulty":4,"biomes":["Cave","Forest","Ayleid","Dwemer"]},{"name":"Frost-Atronach","health":3,"difficulty":5,"biomes":["Oblivion"]},{"name":"Argonian Thief","health":2,"difficulty":3,"biomes":["Mountains","Jungle","Desert","Tundra","Forest","Plains","Urban"]},{"name":"Feral Werewolf","health":6,"difficulty":8,"biomes":["Mountains","Jungle","Forest","Plains"]},{"name":"Skeleton Archer","health":2,"difficulty":4,"biomes":["Mountains","Jungle","Desert","Cave","Tundra","Forest","Plains","Dwemer"]},{"name":"Crocodile","health":2,"difficulty":4,"biomes":["Jungle","Aquatic"]},{"name":"Nord Highwayman","health":3,"difficulty":6,"biomes":["Mountains","Tundra","Forest","Plains","Urban"]},{"name":"Escaped Prisoner","health":2,"difficulty":4,"biomes":["Mountains","Jungle","Desert","Cave","Tundra","Plains"]},{"name":"Dreugh","health":3,"difficulty":5,"biomes":["Jungle","Cave","Aquatic"]},{"name":"Feral Vampire","health":5,"difficulty":9,"biomes":["Cave"]},{"name":"Altmer Cryomancer","health":4,"difficulty":6,"biomes":["Mountains","Cave","Tundra","Forest","Plains"]},{"name":"Enraged Nereid","health":3,"difficulty":4,"biomes":["Aquatic"]},{"name":"Tundra Boar","health":2,"difficulty":3,"biomes":["Mountains","Tundra"]},{"name":"Slashy McSlash","health":10,"difficulty":10,"biomes":[]},{"name":"Jalil the Swordsmaster","health":7,"difficulty":10,"biomes":[]},{"name":"Layka the Wall","health":7,"difficulty":10,"biomes":[]},{"name":"Vendramo the Viper","health":7,"difficulty":10,"biomes":[]},{"name":"Miriam the Molten","health":7,"difficulty":10,"biomes":[]},{"name":"Thiriel the Frozen","health":7,"difficulty":10,"biomes":[]},{"name":"Zar\u2019jo the Conduit","health":7,"difficulty":10,"biomes":[]},{"name":"Giant Bat","health":3,"difficulty":2,"biomes":["Mountains","Jungle","Tundra","Forest"]},{"name":"Strange Rat","health":1,"difficulty":1,"biomes":["Urban","Oblivion"]},{"name":"Vile Wight","health":4,"difficulty":4,"biomes":["Mountains","Cave","Tundra","Forest","Ayleid"]},{"name":"Ogre Brute","health":6,"difficulty":4,"biomes":["Mountains","Cave","Forest","Plains"]},{"name":"Frost Wisp","health":2,"difficulty":5,"biomes":["Mountains","Cave","Tundra","Ayleid"]},{"name":"Mire Leech","health":1,"difficulty":3,"biomes":["Jungle"]},{"name":"Bog Spectre","health":2,"difficulty":5,"biomes":["Jungle","Cave","Plains"]},{"name":"Mountain Lion","health":3,"difficulty":6,"biomes":["Mountains","Plains"]},{"name":"Timber Wolf","health":3,"difficulty":4,"biomes":["Mountains","Cave","Tundra","Forest","Plains"]},{"name":"Forest Troll","health":4,"difficulty":5,"biomes":["Cave","Forest","Plains","Ayleid"]},{"name":"Panther","health":2,"difficulty":7,"biomes":["Jungle"]},{"name":"Volt-Asp","health":2,"difficulty":6,"biomes":["Jungle","Desert","Plains"]},{"name":"Storm Stag","health":4,"difficulty":4,"biomes":["Forest","Plains"]},{"name":"Dire Bat","health":1,"difficulty":3,"biomes":["Cave","Urban"]},{"name":"Frost Hound","health":3,"difficulty":6,"biomes":["Mountains","Tundra"]},{"name":"Colovian Hawk","health":2,"difficulty":3,"biomes":["Mountains","Plains"]},{"name":"Dune Raptor","health":3,"difficulty":6,"biomes":["Desert"]},{"name":"Dire Vulture","health":2,"difficulty":4,"biomes":["Desert"]},{"name":"Ash Viper","health":2,"difficulty":5,"biomes":["Desert"]},{"name":"Breton Robber-Knight","health":4,"difficulty":7,"biomes":["Forest","Plains","Urban"]},{"name":"Greater Wolf","health":5,"difficulty":5,"biomes":["Mountains","Cave","Forest"]},{"name":"Altmer Renegade","health":3,"difficulty":7,"biomes":["Forest","Urban","Ayleid"]},{"name":"Nibenese Silk-Harvester","health":4,"difficulty":6,"biomes":["Forest","Urban","Ayleid"]},{"name":"Death Wasp","health":1,"difficulty":11,"biomes":["Jungle","Forest"]},{"name":"Lesser Spriggan","health":3,"difficulty":5,"biomes":["Forest"]},{"name":"Lesser Minotaur","health":4,"difficulty":5,"biomes":["Cave","Forest","Plains","Ayleid"]},{"name":"Crescent Viper","health":2,"difficulty":7,"biomes":["Jungle"]},{"name":"Bosmer Raider","health":2,"difficulty":7,"biomes":["Jungle","Forest"]},{"name":"Goblin Skirmisher","health":3,"difficulty":4,"biomes":["Mountains","Jungle","Desert","Cave","Tundra","Forest","Plains","Urban","Ayleid"]},{"name":"Storm Boar","health":4,"difficulty":5,"biomes":["Cave","Forest","Plains"]},{"name":"Reman Legionary","health":4,"difficulty":5,"biomes":["Jungle","Cave","Tundra"]}];

function getXPForLevel(level) {
	for (const t of XP_THRESHOLDS) if (level >= t.min) return t.xp;
	return 100;
}

function totalXPNeeded(from, to) {
	let t = 0;
	for (let l = from; l < to; l++) t += getXPForLevel(l + 1);
	return t;
}

function getCrisisDR(crisis) {
	if (crisis > 100) return 3;
	if (crisis >= 76) return 2;
	if (crisis >= 51) return 1;
	return 0;
}

function encounterXP(diff, health, wf, crisis) {
	const dr = Math.max(0, diff + getCrisisDR(crisis));
	const rh = health * 0.75;
	const dice = 13.5;
	return Math.floor((dice + dr * rh * 0.75) * (wf / 100));
}

function questXPPerDay(quests) {
	return quests.reduce((sum, q) => sum + q.xp / q.cooldown, 0);
}

function getMatchingEnemies(biome) {
	return ENEMIES.filter(e => {
		if (biome && !e.biomes.includes(biome)) return false;
		return true;
	});
}

const factionSel = document.getElementById('faction');
Object.entries(FACTIONS).forEach(([key, f]) => {
	const opt = document.createElement('option');
	opt.value = key;
	opt.textContent = f.display;
	factionSel.appendChild(opt);
});

const biomeSel = document.getElementById('biome');
BIOMES.forEach(b => {
	const opt = document.createElement('option');
	opt.value = b;
	opt.textContent = b;
	biomeSel.appendChild(opt);
});

let chart;

function calculate() {
	const curLevel		= Math.max(0,	parseInt(document.getElementById('curLevel').value)	|| 0);
	const desLevel		= Math.min(20,	parseInt(document.getElementById('desLevel').value)	|| 20);
	const energy		= Math.max(1,	parseInt(document.getElementById('energy').value)	|| 3);
	const curXP			= parseInt(document.getElementById('curXP').value)					|| 0;
	const crisis		= parseInt(document.getElementById('crisis').value)					|| 0;
	const wf			= parseFloat(document.getElementById('wellfed').value)				|| 95;
	const biome			= document.getElementById('biome').value;
	const tierName		= document.getElementById('encDifficulty').value;
	const factionKey	= document.getElementById('faction').value;
	const useWeekly		= document.getElementById('weeklyXP').checked;

	const matching		= getMatchingEnemies(biome);
	const warningEl		= document.getElementById('biomeWarning');
	const modifier		= DIFFICULTY_MODIFIERS[tierName];

	let xpLow = 0, xpAvg = 0, xpHigh = 0;

	if (matching.length === 0) {
		warningEl.style.display = '';
		warningEl.textContent = `No enemies found for ${biome || "any biome"}. Showing 0 XP from encounters.`;
	} else {
		warningEl.style.display = 'none';
		const xpValues = matching.map(e => {
			const effDiff	= Math.max(0, e.difficulty + modifier.dr);
			const effHealth	= Math.max(1, e.health + modifier.hp);
			return encounterXP(effDiff, effHealth, wf, crisis);
		});
		xpLow	= Math.min(...xpValues);
		xpHigh	= Math.max(...xpValues);
		xpAvg	= xpValues.reduce((a, b) => a + b, 0) / xpValues.length;
	}

	const xpFromEncLow	= xpLow		* energy;
	const xpFromEncAvg	= xpAvg		* energy;
	const xpFromEncHigh	= xpHigh	* energy;

	const faction		= factionKey	? FACTIONS[factionKey] : null;
	const questXPDay	= faction		? questXPPerDay(faction.quests) : 0;
	const weeklyXPDay	= useWeekly		? 150 / 7 : 0;

	const xpPerDayLow	= xpFromEncLow	+ questXPDay + weeklyXPDay;
	const xpPerDayAvg	= xpFromEncAvg	+ questXPDay + weeklyXPDay;
	const xpPerDayHigh	= xpFromEncHigh	+ questXPDay + weeklyXPDay;

	const needed		= Math.max(0, totalXPNeeded(curLevel, desLevel) - curXP);
	const daysHigh		= xpPerDayLow	> 0 ? Math.ceil(needed / xpPerDayLow)	: Infinity;
	const daysAvg		= xpPerDayAvg	> 0 ? Math.ceil(needed / xpPerDayAvg)	: Infinity;
	const daysLow		= xpPerDayHigh	> 0 ? Math.ceil(needed / xpPerDayHigh)	: Infinity;

	const totalEncsHigh	= xpHigh	> 0 ? Math.ceil(needed / xpHigh)	: Infinity;
	const totalEncsAvg	= xpAvg		> 0 ? Math.ceil(needed / xpAvg)		: Infinity;
	const totalEncsLow	= xpLow		> 0 ? Math.ceil(needed / xpLow)		: Infinity;

	if (faction) {
		document.getElementById('questInfo').style.display = '';
		const tbody = document.getElementById('questRows');
		tbody.innerHTML = '';
		let totalXP = 0;
		let totalXPD = 0;
		faction.quests.forEach(q => {
			const xpd = q.xp / q.cooldown;
			totalXP += q.xp;
			totalXPD += xpd;
			const tr = document.createElement('tr');
			tr.innerHTML = `<td>${q.name}</td><td>${q.xp}</td><td>${q.cooldown}d</td><td>${xpd.toFixed(1)}/day</td>`;
			tbody.appendChild(tr);
		});

		document.getElementById('totalQuestXP').textContent		= totalXP;
		document.getElementById('totalQuestXPDay').textContent	= totalXPD.toFixed(1) + '/day';
	} else {
		document.getElementById('questInfo').style.display = 'none';
	}

	const fmtDays = d => d === Infinity ? '∞' : d.toLocaleString();
	const fmtRange = (low, avg, high) => `${low.toLocaleString()} - ${avg.toLocaleString()} - ${high.toLocaleString()}`;

	document.getElementById('results').innerHTML = `
		<div class="metric">
			<div class="metric-label">XP per encounter</div>
			<div class="metric-value">${Math.round(xpAvg).toLocaleString()}</div>
			<div class="metric-range">low ${Math.round(xpLow)} · high ${Math.round(xpHigh)}</div>
			<div class="metric-sub">${matching.length} enemies matched</div>
		</div>
		<div class="metric">
			<div class="metric-label">XP per day</div>
			<div class="metric-value">${Math.round(xpPerDayAvg).toLocaleString()}</div>
			<div class="metric-range">low ${Math.round(xpPerDayLow)} · high ${Math.round(xpPerDayHigh)}</div>
			<div class="metric-sub">quests+weekly: ${(questXPDay + weeklyXPDay).toFixed(1)}/day</div>
		</div>
		<div class="metric">
			<div class="metric-label">XP needed</div>
			<div class="metric-value">${needed.toLocaleString()}</div>
			<div class="metric-sub">lv ${curLevel} → ${desLevel}</div>
		</div>
		<div class="metric">
			<div class="metric-label">Days to goal</div>
			<div class="metric-value" style="color:var(--accent)">${fmtDays(daysAvg)}</div>
			<div class="metric-range">fastest ${fmtDays(daysLow)} · slowest ${fmtDays(daysHigh)}</div>
		</div>
		<div class="metric">
			<div class="metric-label">Total encounters</div>
			<div class="metric-value">${totalEncsAvg === Infinity ? '∞' : totalEncsAvg.toLocaleString()}</div>
			<div class="metric-range">${totalEncsHigh === Infinity ? '∞' : totalEncsHigh.toLocaleString()} - ${totalEncsLow === Infinity ? '∞' : totalEncsLow.toLocaleString()}</div>
			<div class="metric-sub">from encounters only</div>
		</div>
	`;
}

const calcs = ['curLevel','desLevel','curXP','crisis','energy','wellfed','encDifficulty','biome','faction','weeklyXP'];
calcs.forEach(id => document.getElementById(id).addEventListener('input', calculate));
document.getElementById('weeklyXP').addEventListener('change', calculate);

calculate();
</script>
</body>
</html>
