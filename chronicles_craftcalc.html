<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crafting Cost Calculator</title>
<style>
	:root {
		--bg:		#14181fff;
		--panel:	#1c222cff;
		--panel2:	#232a36ff;
		--border:	#2e3644ff;
		--text:		#e8ecf3ff;
		--muted:	#8b95a7ff;
		--accent:	#d4a24cff;
		--accent2:	#5ba3d0ff;
		--good:		#5fb87aff;
		--bad:		#e2695fff;
		--black:	#000000ff;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		font-family: 'Segoe UI', 'Tahoma', 'sans-serif';
		background: var(--bg);
		color: var(--text);
		min-height: 100vh;
		padding: 24px;
	}

	h1 {
		text-align: center;
		font-size: 1.5rem;
		margin: 0 0 4px;
		margin-bottom: 30px;
		letter-spacing: .5px;
	}

	.sub {
		color: var(--muted);
		margin-bottom: 20px;
		font-size: .9rem;
	}

	.grid {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 18px;
		max-width: 1300px;
		margin: 0 auto;
	}

	@media(max-width:900px) { .grid { grid-template-columns: 1fr; } }
	.panel {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 4px;
		padding: 16px 18px;
		box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
	}
	.panel h2 {
		font-size: 1.05rem;
		margin: 0 0 12px;
		color: var(--accent);
		display: flex;
		align-items: center;
		gap: 8px;
		font-weight: 700;
	}

	.full { grid-column: 1/-1; }
	.center {
		grid-column: 1/-1;
		max-width: 1300px;
		margin: 0 auto 18px;
		justify-content: space-between;
		align-items: center;
		flex-wrap: wrap;
		gap: 10px;
		width: 25%;
	}

	.search-row {
		display: flex;
		gap: 8px;
		margin-bottom: 10px;
	}

	input[type=text], input[type=number], select {
		background: var(--panel2);
		border: 1px solid var(--border);
		color: var(--text);
		padding: 7px 9px;
		border-radius: 4px;
		font-size: .9rem;
	}
	input[type=text] { flex: 1; }
	input[type=number] { width: 70px; }
	select {
		flex: 1;
		max-width: 100%;
	}

	button {
		background: var(--accent2);
		color: #0d1117;
		border: none;
		padding: 7px 12px;
		border-radius: 4px;
		font-weight: 600;
		font-size: .85rem;
		cursor: pointer;
	}
	button:hover { filter: brightness(1.15); }
	button.secondary {
		background: var(--panel2);
		color: var(--text);
		border: 1px solid var(--border);
	}
	button.danger {
		background: var(--bad);
		color: #1a0f0d;
	}
	button.small {
		padding: 3px 8px;
		font-size: .75rem;
	}
	#calcBtn {
		display: none;
	}

	.autocomplete { position:relative; }
	.ac-list {
		position: absolute;
		top: 100%;
		left: 0;
		right: 0;
		background: var(--panel2);
		border: 1px solid var(--border);
		border-radius: 4px;
		max-height: 220px;
		overflow-y: auto;
		z-index: 20;
		margin-top: 2px;
	}
	.ac-item {
		padding: 7px 10px;
		cursor: pointer;
		font-size: .85rem;
		border-bottom: 1px solid var(--border);
	}
	.ac-item:last-child { border-bottom: none; }
	.ac-item:hover { background: #2a3242; }
	.ac-item small {
		color: var(--muted);
		display: block;
	}

	table {
		width: 100%;
		border-collapse: collapse;
		font-size: .85rem;
	}

	th {
		text-align: left;
		color: var(--muted);
		font-weight: 600;
		padding: 6px 8px;
		border-bottom: 1px solid var(--border);
	}
	td {
		padding: 6px 8px;
		border-bottom: 1px solid #232a36;
	}
	tr:last-child td { border-bottom: none; }

	.row-name { font-weight: 600; }

	.qty-input { width: 60px; }

	.list-empty {
		color: var(--muted);
		font-style: italic;
		font-size: .85rem;
		padding: 10px 0;
	}

	.tag {
		display: inline-block;
		font-size: .7rem;
		padding: 1px 6px;
		border-radius: 4px;
		background: #2a3242;
		color: var(--muted);
		margin-left: 6px;
	}

	.result-section h3 {
		margin: 14px 0 6px;
		color: var(--accent2);
		font-size: .95rem;
	}
	.result-section h3:first-child { margin-top: 0; }

	.need-more {
		color: var(--bad);
		font-weight: 700;
	}
	.have-enough { color: var(--good); }

	.actions-top {
		display: flex;
		justify-content: space-between;
		align-items: center;
		margin-bottom: 10px;
	}

	.pill-btns {
		display: flex;
		gap: 6px;
	}

	.scrollbox {
		max-height: 280px;
		overflow-y: auto;
	}

	::-webkit-scrollbar { width: 8px; }
	::-webkit-scrollbar-thumb {
		background: #333c4a;
		border-radius: 4px;
	}

	.customize-row td {
		background: var(--panel2);
		padding: 10px 12px;
	}
	.customize-panel {
		display: flex;
		flex-direction: column;
		gap: 8px;
	}

	.cz-title {
		font-weight: 600;
		color: var(--accent2);
		font-size: .85rem;
		display: flex;
		align-items: center;
		gap: 6px;
	}
	.cz-row {
		display: flex;
		align-items: center;
		font-size: .82rem;
		gap: 8px;
	}
	.cz-row label {
		color: var(--muted);
		min-width: 90px;
	}
	.cz-row select {
		flex: 1;
		max-width: 420px;
	}

	footer {
		text-align: center;
		color: var(--muted);
		font-size: .75rem;
		margin-top: 26px;
		text-shadow: 1px 1px 15px var(--black);
	}
	footer .block-line > span {
		display: inline-block;
	}

	span.block-line {
		-webkit-background-clip: text;
		background-clip: text;
		color: transparent;
		display: inline-block;
		background-image: linear-gradient(90deg,
			#c63939ff,
			#c66839ff,
			#c69739ff,
			#c6c639ff,
			#97c639ff,
			#68c639ff,
			#39c639ff,
			#39c668ff,
			#39c697ff,
			#39c6c6ff,
			#3997c6ff,
			#3968c6ff,
			#3939c6ff,
			#6839c6ff,
			#9739c6ff,
			#c639c6ff,
			#c63997ff,
			#c63968ff,
			#c63939ff
		);
	}

	.sidenav {
		position: fixed;
		top: 37%;
		width: 13%;
		left: 0;
		overflow-x: hidden;
	}
</style>
</head>

<body>

<!-- OPTIONS -->
<div class="panel sidenav">
	<h2>Options</h2>
	<div class="cz-title" style="margin-bottom: 5px;">Backup</div>
	<div class="pill-btns">
		<button class="secondary small" id="importAllBtn">Import</button>
		<button class="secondary small" id="exportAllBtn">Export</button>
		<input type="file" id="importAllFile" accept="application/json" style="display: none;">
	</div>
	<div id="quickStats" style="font-size: .9rem; line-height: 1.9;"></div>
	<div class="cz-title" style="margin-top: 6px;">Include in cost totals:</div>
	<div style="display: flex; flex-direction: column; gap: 4px; font-size: .85rem; margin: 6px 0 10px;">
		<label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"><input type="checkbox" id="toggleMods" checked> Modifications</label>
		<label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"><input type="checkbox" id="toggleEnchant" checked> Enchantments</label>
		<label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"><input type="checkbox" id="toggleLegendary" checked> Legendary Effects</label>
	</div>
	<button id="calcBtn" style="width: 100%; margin-top: 10px; padding: 10px;">Recalculate (Debug)</button>
</div>

<h1>Elder Scrolls: Chronicles - Crafting Cost Calculator</h1>

<div class="grid">
	<!-- INVENTORY -->
	<div class="panel">
		<h2>Inventory</h2>
		<div class="search-row" id="invSearchWrap">
			<select id="invSelect"></select>
			<input type="number" id="invQty" value="1" min="0">
			<button id="invAddBtn">Add</button>
		</div>
		<div class="scrollbox">
			<table id="invTable">
				<thead><tr><th>Item</th><th>Quantity</th><th></th></tr></thead>
				<tbody></tbody>
			</table>
			<div class="list-empty" id="invEmpty">EMPTY</div>
		</div>
	</div>

	<!-- DESIRED GEAR -->
	<div class="panel">
		<h2>Desired Gear</h2>
		<div class="search-row" id="desiredSearchWrap">
			<select id="desiredSelect"></select>
			<button id="desiredAddBtn">Add</button>
		</div>
		<div class="scrollbox" id="favBox">
			<div class="list-empty" id="favEmpty">EMPTY</div>
			<table id="favTable" style="display: none;">
				<thead><tr><th>Item</th><th></th></tr></thead>
				<tbody></tbody>
			</table>
		</div>
	</div>

	<!-- REPAIR LIST -->
	<div class="panel">
		<h2>To Repair</h2>
		<div class="search-row" id="repairSearchWrap">
			<select id="repairSelect"></select>
			<input type="number" id="repairQty" value="1" min="1">
			<button id="repairAddBtn">Add</button>
		</div>
		<div class="scrollbox">
			<table id="repairTable">
				<thead><tr><th>Item</th><th>Count</th><th></th></tr></thead>
				<tbody></tbody>
			</table>
			<div class="list-empty" id="repairEmpty">EMPTY</div>
		</div>
		<div style="margin-top: 10px;">
			<button class="secondary small" id="clearRepairBtn">Clear</button>
		</div>
	</div>

	<!-- CRAFT LIST -->
	<div class="panel">
		<h2>To Craft</h2>
		<div class="scrollbox">
			<table id="craftTable">
				<thead><tr><th>Item</th><th>Quantity</th><th></th></tr></thead>
				<tbody></tbody>
			</table>
			<div class="list-empty" id="craftEmpty">EMPTY</div>
		</div>
		<div style="margin-top: 10px; display: flex; gap: 8px;">
			<button class="secondary small" id="loadFavsBtn">Import Desired Gear</button>
			<button class="secondary small" id="clearCraftBtn">Clear</button>
		</div>
	</div>

	<!-- RESULTS -->
	<div class="panel full result-section">
		<h2>Results</h2>
		<div id="results"><div class="list-empty">Not calculated yet!</div></div>
	</div>

</div>

<footer>
	<span class="block-line">Meow :3</span>
</footer>

/* ---------- Parse raw data into item DB ---------- */
function parseIngredients(str) {
	str = str.trim();

	if (!str || str.toUpperCase() === 'N/A') return [];
	return str.split(',').map(tok => {
		tok = tok.trim();
		const m = tok.match(/^(\d+)\s+(.+)$/);
		if (m) return { name:m[2].trim(), qty:parseInt(m[1],10) };
		return {name:tok, qty:1};
	});
}

function mergeIngredientLists(...lists) {
	const byName = {};
	const order = [];

	lists.forEach(list => (list||[]).forEach(ing => {
		if (!(ing.name in byName)) {
			byName[ing.name] = 0;
			order.push(ing.name);
		}

		byName[ing.name] += ing.qty;
	}));

	return order.map(name => ({name, qty:byName[name]}));
}

/* ---------- Modifications / Enchantments / Legendary Effects ---------- */
// Category aliasing: the source tables use some category names that don't exactly match
// the item categories used above (e.g. weapon subtypes, "Flasks" vs "Potion Flasks").
const ALL_ITEM_CATEGORIES = [
	'Light Armor',
	'Medium Armor',
	'Heavy Armor',
	'Robes',
	'Clothes',
	'Staves',
	'Shields',
	'1H Weapons',
	'2H Weapons',
	'Bows',
	'Rings',
	'Amulets',
	'Talismans',
	'Potion Flasks'
];

function expandCategories(str) {
	const out = new Set();

	str.split(',').map(s => s.trim()).filter(Boolean).forEach(cat => {
		if (cat === 'All Items Except Flasks') ALL_ITEM_CATEGORIES.filter(c => c!=='Potion Flasks').forEach(c => out.add(c));
		else if (cat === 'Flasks') out.add('Potion Flasks');
		else if (/^1H .*Weapons$/.test(cat)) out.add('1H Weapons');
		else if (/^2H .*Weapons$/.test(cat)) out.add('2H Weapons');
		else out.add(cat);
	});

	return out;
}

function parseUpgradeTable(raw) {
	const db = {};

	raw.trim().split('\n').forEach(line => {
		const parts = line.split('|');
		const [name, cats, effect, cost] = parts;
		db[name.trim()] = {
			name: name.trim(),
			categories: expandCategories(cats||''),
			effect: (effect||'').trim(),
			cost: parseIngredients(cost||'')
		};
	});

	return db;
}

function modSlotsForItem(item) {
	if (!item) return 1;
	return (item.category === 'Bows' || item.category === '2H Weapons') ? 2 : 1;
}

function applicableEntries(db, item) {
	if (!item) return [];
	return Object.values(db).filter(e => e.categories.has(item.category));
}

function isMasterwork(item) {
	return item && item.tier === 'Masterwork';
}

const ITEMS = {};
RAW_ITEMS.split('\n').forEach(line => {
	const parts = line.split('|');
	if (parts.length < 3) return;
	const [name, category, craftCost, upgradesTo, modCost, tier, repairCost] = parts;
	ITEMS[name.trim()] = {
		name: name.trim(),
		category: category.trim(),
		tier: (tier||'').trim(),
		ingredients: parseIngredients(craftCost || ''),
		upgradesTo: (upgradesTo||'').trim(),
		modIngredients: parseIngredients(modCost || ''),
		repairIngredients: parseIngredients(repairCost || '')
	};
});

// preserves CSV order
const ITEM_NAMES = Object.keys(ITEMS);

/* ---------- Persistent state ---------- */
const STORE_KEY = 'craftCalcState_v1';
let state = {
	inventory: {},
	craftList: {},
	repairList: {},
	favorites: [],
	customizations: {},
	invCustomizations: {},
	favCustomizations: {}
};

function loadState() {
	try {
		const raw = localStorage.getItem(STORE_KEY);
		if(raw) state = Object.assign(state, JSON.parse(raw));
	} catch(e) {}
}

function saveState() {
	try {
		localStorage.setItem(STORE_KEY, JSON.stringify(state));
	} catch(e) {}
}

loadState();
if (!state.favCustomizations || typeof state.favCustomizations !== 'object') state.favCustomizations = {};
if (!state.invCustomizations || typeof state.invCustomizations !== 'object') state.invCustomizations = {};

function genId() {
	return 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,9);
}

if (Array.isArray(state.favorites) && state.favorites.length && typeof state.favorites[0] === 'string') {
	state.favorites = state.favorites.map(n => {
		const id = genId();
		const c = state.customizations[n];
		if (c && ((c.mods||[]).filter(Boolean).length || c.enchant || c.legendary)) {
			state.favCustomizations[id] = {mods:(c.mods||[]).filter(Boolean), enchant:c.enchant||null, legendary:c.legendary||null};
		}

		return {id, name:n};
	});

	saveState();
}

function escapeHtml(s) {
	return s.replace(/[&<>"']/g, c => ({
		'&': '&amp;',
		'<': '&lt;',
		'>': '&gt;',
		'"': '&quot;',
		"'": '&#39;'
	}[c]));
}

/* Build the full pool of names for inventory: all raw materials (grouped by gathering node)
	 + all crafted items (grouped by crafting category) */
function buildSelect(selectEl, {includeMaterials, includeItems, itemFilter}) {
	selectEl.innerHTML = '';

	if (includeMaterials) {
		// group materials by gathering node, in tier order within each node
		const nodeOrder = [
			'Light Metals',
			'Heavy Metals',
			'Thin-Weave Cloth',
			'Dense-Weave Cloth',
			'Light Wood',
			'Heavy Wood',
			'Precious Alloys',
			'Precious Gems',
			'N/A'
		];

		const byNode = {};
		Object.values(MATERIALS).forEach(m => {
			(byNode[m.node] = byNode[m.node] || []).push(m);
		});

		const tierRank = {
			'1': 1,
			'2': 2,
			'3': 3,
			'Masterwork': 4,
			'N/A': 5
		};

		nodeOrder.forEach(node => {
			if (!byNode[node]) return;
			const group = document.createElement('optgroup');
			group.label = 'Resource - ' + node;
			byNode[node].sort((a,b) => (tierRank[a.tier]||9) - (tierRank[b.tier]||9)).forEach(m => {
				const opt = document.createElement('option');
				opt.value = m.name;
				opt.textContent = m.tier && m.tier!=='N/A' ? `${m.name} (Tier ${m.tier})` : m.name;
				group.appendChild(opt);
			});

			selectEl.appendChild(group);
		});
	}

	if (includeItems) {
		const byCat = {};
		const catOrder = [];
		ITEM_NAMES.filter(n  =>  !itemFilter || itemFilter(ITEMS[n])).forEach(n => {
			const it = ITEMS[n];
			if (!byCat[it.category]) {
				byCat[it.category] = [];
				catOrder.push(it.category);
			}

			byCat[it.category].push(n);
		});

		catOrder.forEach(cat => {
			const group = document.createElement('optgroup');
			group.label = 'Gear - ' + cat;
			byCat[cat].forEach(n => {
				const it = ITEMS[n];
				const opt = document.createElement('option');
				opt.value = n;
				opt.textContent = it.tier ? `${n} (Tier ${it.tier})` : n;
				group.appendChild(opt);
			});

			selectEl.appendChild(group);
		});
	}
}

/* ---------- Inventory UI ---------- */
const invSelect = document.getElementById('invSelect');
const invQty = document.getElementById('invQty');
buildSelect(invSelect, {
	includeMaterials:true,
	includeItems:true
});

document.getElementById('invAddBtn').addEventListener('click', () => {
	const name = invSelect.value;
	if (!name) return;
	const qty = Math.max(0, parseInt(invQty.value,10) || 0);
	state.inventory[name] = (state.inventory[name] || 0) + qty;
	invQty.value=1;
	saveState();
	renderInventory();
	renderQuickStats();
	refreshRepairSelect();
});

function renderInventory() {
	const tbody = document.querySelector('#invTable tbody');
	const names = Object.keys(state.inventory).filter(n => state.inventory[n] > 0).sort();
	document.getElementById('invEmpty').style.display = names.length ? 'none' : 'block';
	document.getElementById('invTable').style.display = names.length ? 'table' : 'none';
	tbody.innerHTML = names.map(n => {
		const item = ITEMS[n];
		const expanded = expandedInvItems.has(n);
		const mainRow = `
		<tr>
			<td class="row-name">${escapeHtml(n)}${item?customSummary(state.invCustomizations[n]):''}</td>
			<td><input type="number" class="qty-input inv-qty" data-name="${escapeHtml(n)}" value="${state.inventory[n]}" min="0"></td>
			<td>
				${item ? `<button class="secondary small customize-toggle-inv" data-name="${escapeHtml(n)}" title="Modifications / Enchantments / Legendary">${expanded?'^':'*'}</button>` : ''}
				<button class="danger small inv-remove" data-name="${escapeHtml(n)}">X</button>
			</td>
		</tr>`;
		const detailRow = (item && expanded) ? `
		<tr class="customize-row">
			<td colspan="3">${renderCustomizePanel(n, item, getInvCustom(n))}</td>
		</tr>` : '';
		return mainRow + detailRow;
	}).join('');

	tbody.querySelectorAll('.inv-qty').forEach(inp => {
		inp.addEventListener('change', () => {
			const v = Math.max(0, parseInt(inp.value,10) || 0);
			state.inventory[inp.dataset.name] = v;
			saveState();
			renderQuickStats();
			refreshRepairSelect();
			renderResults();
		});
	});

	tbody.querySelectorAll('.inv-remove').forEach(btn => {
		btn.addEventListener('click', () => {
			delete state.inventory[btn.dataset.name];
			delete state.invCustomizations[btn.dataset.name];
			expandedInvItems.delete(btn.dataset.name);
			saveState();
			renderInventory();
			renderQuickStats();
			refreshRepairSelect();
			renderResults();

const expandedCraftItems	= new Set();
const expandedInvItems		= new Set();
const expandedFavItems		= new Set();

function getCustom(name) {
	if (!state.customizations[name]) state.customizations[name] = {mods:[], enchant:null, legendary:null};
	const c = state.customizations[name];
	if (!Array.isArray(c.mods)) c.mods = [];

function getInvCustom(name) {
	if (!state.invCustomizations[name]) state.invCustomizations[name] = {mods:[], enchant:null, legendary:null};
	const c = state.invCustomizations[name];
	if (!Array.isArray(c.mods)) c.mods = [];

function getFavCustom(id) {
	if (!state.favCustomizations[id]) state.favCustomizations[id] = {mods:[], enchant:null, legendary:null};
	const c = state.favCustomizations[id];
	if (!Array.isArray(c.mods)) c.mods = [];

function customSummary(custom) {
	if (!custom) return '';
	const bits = [];
	const modCount = (custom.mods||[]).filter(Boolean).length;
	if (modCount)			bits.push(`${modCount} mod${modCount>1?'s':''}`);
	if (custom.enchant)		bits.push('enchanted');

/* ---------- Customizations (modifications / enchantment / legendary) ---------- */
function renderCustomizePanel(key, item, custom) {
	const slots = modSlotsForItem(item);
	const mods = applicableEntries(MODIFICATIONS, item).sort((a, b) => a.name.localeCompare(b.name));
	const enchants = applicableEntries(ENCHANTMENTS, item).sort((a, b) => a.name.localeCompare(b.name));
	const legendaries = isMasterwork(item) ? applicableEntries(LEGENDARY_EFFECTS, item).sort((a,b) => a.name.localeCompare(b.name)) : [];

	const modRows = [];
	for (let i = 0; i < slots; i++) {
		const current = custom.mods[i] || '';
		const options = mods.filter(m => {
			const selectedElsewhere = custom.mods.some((v, idx) => v === m.name && idx !== i);
			return !selectedElsewhere;
		});

		modRows.push(`
			<div class="cz-row">
				<label>Mod slot ${i + 1}:</label>
				<select class="cz-mod-select" data-key="${escapeHtml(key)}" data-slot="${i}">
					<option value="">- none -</option>
					${options.map(m => `<option value="${escapeHtml(m.name)}" ${m.name===current?'selected':''}>${escapeHtml(m.name)} - ${escapeHtml(m.effect)}</option>`).join('')}
				</select>
			</div>`
		);
	}

	const enchantRow = enchants.length ? `
		<div class="cz-row">
			<label>Enchantment:</label>
			<select class="cz-enchant-select" data-key="${escapeHtml(key)}">
				<option value="">- none -</option>
				${enchants.map(en => `<option value="${escapeHtml(en.name)}" ${custom.enchant===en.name?'selected':''}>${escapeHtml(en.name)} - ${escapeHtml(en.effect)}</option>`).join('')}
			</select>
		</div>` : `<div class="cz-row"><span class="tag">No enchantments apply to this item's category.</span></div>`;

	const legendaryRow = isMasterwork(item)
		? (legendaries.length ? `
			<div class="cz-row">
				<label>Legendary:</label>
				<select class="cz-legendary-select" data-key="${escapeHtml(key)}">
					<option value="">- none -</option>
					${legendaries.map(le => `<option value="${escapeHtml(le.name)}" ${custom.legendary===le.name?'selected':''}>${escapeHtml(le.name)} - ${escapeHtml(le.effect)}</option>`).join('')}
				</select>
			</div>` : `<div class="cz-row"><span class="tag">No legendary effects apply to this item's category.</span></div>`)
		: `<div class="cz-row"><span class="tag">Legendary effects require T4 gear.</span></div>`;

	return `
		<div class="customize-panel">
			<div class="cz-title">Customize: ${escapeHtml(item.name)} <span class="tag">${slots} mod slot${slots>1?'s':''}</span></div>
			${modRows.join('')}
			${enchantRow}
			${legendaryRow}
		</div>
	`;
}

function bindCustomizePanelEvents(root, resolveCustom) {
	root = root || document;
	resolveCustom = resolveCustom || getCustom;

	function refreshResultsIfShown() {
		renderResults();
	}

	root.querySelectorAll('.cz-mod-select').forEach(sel => {
		sel.addEventListener('change', () => {
			const key = sel.dataset.key;
			const slot = parseInt(sel.dataset.slot,10);
			const custom = resolveCustom(key);
			custom.mods[slot] = sel.value || undefined;
			saveState();
			renderInventory();
			renderCraftList();
			renderFavorites();
			renderQuickStats();
			refreshResultsIfShown();
		});
	});

	root.querySelectorAll('.cz-enchant-select').forEach(sel => {
		sel.addEventListener('change', () => {
			const custom = resolveCustom(sel.dataset.key);
			custom.enchant = sel.value || null;
			saveState();
			renderInventory();
			renderCraftList();
			renderFavorites();
			renderQuickStats();
			refreshResultsIfShown();
		});
	});

	root.querySelectorAll('.cz-legendary-select').forEach(sel => {
		sel.addEventListener('change', () => {
			const custom = resolveCustom(sel.dataset.key);
			custom.legendary = sel.value || null;
			saveState();
			renderInventory();
			renderCraftList();
			renderFavorites();
			renderQuickStats();
			refreshResultsIfShown();
		});
	});
}

/* ---------- Quick stats (old) ---------- */
function renderQuickStats() {}

/* ---------- Resolver ---------- */
function resolveAll(options) {
	options = options || {};

	const includeMods		= options.includeMods		!== false;
	const includeEnchant	= options.includeEnchant	!== false;
	const includeLegendary	= options.includeLegendary	!== false;

	const have = {};
	Object.keys(state.inventory).forEach(n => {
		have[n] = state.inventory[n] || 0;
	});

	const craftedNeeded		= {};
	const rawNeeded			= {};
	const fromInventory		= {};
	const repairRawNeeded	= {};
	const customRawNeeded	= {};

	function resolve(name, qty, rawBucket) {
		if (qty <= 0) return;
		const owned = have[name] || 0;
		const used = Math.min(owned, qty);
		if (used > 0) {
			have[name] -= used;
			fromInventory[name] = (fromInventory[name] || 0) + used;
		}

		const remaining = qty - used;
		if (remaining <= 0) return;

		const item = ITEMS[name];
		if (item && item.ingredients.length) {
			craftedNeeded[name] = (craftedNeeded[name] || 0) + remaining;
			item.ingredients.forEach(ing => {
				resolve(ing.name, ing.qty * remaining, rawBucket);
			});
		} else {
			rawBucket[name] = (rawBucket[name]||0) + remaining;
		}
	}

	Object.keys(state.craftList).forEach(n => {
		resolve(n, state.craftList[n], rawNeeded);
	});

	// Modifications / Enchantments / Legendaries attached to craft-list items
	Object.keys(state.craftList).forEach(n => {
		const qty = state.craftList[n];
		const custom = state.customizations[n];
		if (!custom) return;
		const item = ITEMS[n];
		if (includeMods) {
			(custom.mods||[]).filter(Boolean).forEach(modName => {
				const mod = MODIFICATIONS[modName];
				if (!mod) return;
				(item.modIngredients || []).forEach(ing => resolve(ing.name, ing.qty * qty, customRawNeeded));
				mod.cost.forEach(ing => resolve(ing.name, ing.qty * qty, customRawNeeded));
			});
		}

		if (includeEnchant && custom.enchant && ENCHANTMENTS[custom.enchant]) {
			ENCHANTMENTS[custom.enchant].cost.forEach(ing => resolve(ing.name, ing.qty * qty, customRawNeeded));
		}

		if (includeLegendary && custom.legendary && isMasterwork(item) && LEGENDARY_EFFECTS[custom.legendary]) {
			LEGENDARY_EFFECTS[custom.legendary].cost.forEach(ing => resolve(ing.name, ing.qty * qty, customRawNeeded));
		}
	});

	Object.keys(state.repairList).forEach(n => {
		const item = ITEMS[n];
		const times = state.repairList[n];
		if (!item || !item.repairIngredients.length) return;
		item.repairIngredients.forEach(ing => {
			resolve(ing.name, ing.qty * times, repairRawNeeded);
		});
	});

	// ----- Gross totals: same breakdown, but WITHOUT deducting inventory -----
	const grossRawNeeded		= {};
	const grossRepairRawNeeded	= {};
	const grossCustomRawNeeded	= {};

	function resolveGross(name, qty, rawBucket) {
		if (qty <= 0) return;
		const item = ITEMS[name];
		if (item && item.ingredients.length) {
			item.ingredients.forEach(ing => {
				resolveGross(ing.name, ing.qty * qty, rawBucket);
			});
		} else {
			rawBucket[name] = (rawBucket[name] || 0) + qty;
		}
	}

	Object.keys(state.craftList).forEach(n => {
		resolveGross(n, state.craftList[n], grossRawNeeded);
	});

	Object.keys(state.craftList).forEach(n => {
		const qty = state.craftList[n];
		const custom = state.customizations[n];
		if (!custom) return;
		const item = ITEMS[n];
		if (includeMods) {
			(custom.mods||[]).filter(Boolean).forEach(modName => {
				const mod = MODIFICATIONS[modName];
				if (!mod) return;
				(item.modIngredients || []).forEach(ing => resolveGross(ing.name, ing.qty * qty, grossCustomRawNeeded));
				mod.cost.forEach(ing => resolveGross(ing.name, ing.qty * qty, grossCustomRawNeeded));
			});
		}

		if (includeEnchant && custom.enchant && ENCHANTMENTS[custom.enchant]) {
			ENCHANTMENTS[custom.enchant].cost.forEach(ing => resolveGross(ing.name, ing.qty * qty, grossCustomRawNeeded));
		}

		if (includeLegendary && custom.legendary && isMasterwork(item) && LEGENDARY_EFFECTS[custom.legendary]) {
			LEGENDARY_EFFECTS[custom.legendary].cost.forEach(ing => resolveGross(ing.name, ing.qty * qty, grossCustomRawNeeded));
		}
	});

	Object.keys(state.repairList).forEach(n => {
		const item = ITEMS[n];
		const times = state.repairList[n];
		if (!item || !item.repairIngredients.length) return;
		item.repairIngredients.forEach(ing => {
			resolveGross(ing.name, ing.qty * times, grossRepairRawNeeded);
		});
	});

	return {
		craftedNeeded,
		rawNeeded,
		fromInventory,
		repairRawNeeded,
		customRawNeeded,
		grossRawNeeded,
		grossRepairRawNeeded,
		grossCustomRawNeeded
	};
}

function getCostToggles() {
	return {
		includeMods:		document.getElementById('toggleMods').checked,
		includeEnchant:		document.getElementById('toggleEnchant').checked,
		includeLegendary:	document.getElementById('toggleLegendary').checked
	};
}

['toggleMods', 'toggleEnchant', 'toggleLegendary'].forEach(id => {
	document.getElementById(id).addEventListener('change', renderResults);
});

document.getElementById('calcBtn').addEventListener('click', renderResults);

function renderResults() {
	const resultsEl = document.getElementById('results');
	if (!Object.keys(state.craftList).length && !Object.keys(state.repairList).length) {
		resultsEl.innerHTML = '<div class="list-empty">Not calculated yet!</div>';
		return;
	}

	const toggles = getCostToggles();
	const {craftedNeeded, rawNeeded, fromInventory, repairRawNeeded, customRawNeeded,
		grossRawNeeded, grossRepairRawNeeded, grossCustomRawNeeded} = resolveAll(toggles);

	let html = '';
	if (Object.keys(state.craftList).length) {
		const targetRows = Object.keys(state.craftList).sort().map(n => {
			const qty = state.craftList[n];
			const covered = fromInventory[n] || 0;
			const stillNeeded = craftedNeeded[n] || 0;
			const status = stillNeeded > 0
				? `<span class="need-more">Need ${stillNeeded} more.</span>`
				: `<span class="have-enough">Complete!</span>`;
			return `<tr><td class="row-name">${escapeHtml(n)}</td><td>${qty}</td><td>${covered}</td><td>${status}</td></tr>`;
		}).join('');

		const intermediateNames = Object.keys(craftedNeeded).filter(n => !(n in state.craftList)).sort();
		const intermediateRows = intermediateNames.map(n => 
			`<tr><td class="row-name">${escapeHtml(n)}</td><td>${craftedNeeded[n]}</td></tr>`
		).join('');

		const perItemNames = Object.keys(state.craftList).sort();
		const perItemRows = perItemNames.map(n => {
			const qty = state.craftList[n];

			// Build the crafting chain
			const chain = [n];
			let current = ITEMS[n];
			while (current) {
				const subItemIng = (current.ingredients || []).find(ing => ITEMS[ing.name]);
				if (!subItemIng) break;
				chain.unshift(subItemIng.name);
				current = ITEMS[subItemIng.name];
			}
			const chainStr = chain.map(escapeHtml).join(' &rarr; ');

			// Flatten this item's full requirement tree down to raw materials
			const flatIngredients = {};
			function flatten(name, multiplier) {
				const it = ITEMS[name];
				if (!it) return;
				it.ingredients.forEach(ing => {
					if (ITEMS[ing.name]) {
						flatten(ing.name, multiplier * ing.qty);
					} else {
						flatIngredients[ing.name] = (flatIngredients[ing.name] || 0) + ing.qty * multiplier;
					}
				});
			}
			flatten(n, qty);

			const ingredientBits = Object.keys(flatIngredients).sort()
				.map(name => `${escapeHtml(name)} x${flatIngredients[name]}`)
				.join(', ') || '-';

			return `<tr><td class="row-name">${chainStr}</td><td>${qty}</td><td>${ingredientBits}</td></tr>`;
		}).join('');

		const perItemNamesOld = Object.keys(craftedNeeded).sort();
		const perItemRowsOld = perItemNamesOld.map(n => {
			const item = ITEMS[n];
			const qty = craftedNeeded[n];
			const ingredientBits = item.ingredients.map(ing => `${escapeHtml(ing.name)} x${ing.qty * qty}`).join(', ') || '-';
			return `<tr><td class="row-name">${escapeHtml(n)}</td><td>${qty}</td><td>${ingredientBits}</td></tr>`;
		}).join('');

		html += `
			<table><thead><tr><th>Item</th><th>Quantity</th><th>Covered</th><th>Status</th></tr></thead>
			<tbody>${targetRows}</tbody></table>

			<h3>Intermediate Items</h3>
			<table><thead><tr><th>Item</th><th>Quantity</th></tr></thead>
			<tbody>${intermediateRows || '<tr><td colspan="2" class="list-empty">None - no upgrade chains involved.</td></tr>'}</tbody></table>

			<h3>Per-Item Ingredients (Total)</h3>
			<table><thead><tr><th>Item</th><th>Quantity</th><th>Ingredients</th></tr></thead>
			<tbody>${perItemRows || '<tr><td colspan="3" class="list-empty">Nothing needed!</td></tr>'}</tbody></table>

			<h3>Per-Item Ingredients (Individual)</h3>
			<table><thead><tr><th>Item</th><th>Quantity</th><th>Ingredients</th></tr></thead>
			<tbody>${perItemRowsOld || '<tr><td colspan="3" class="list-empty">Nothing needed!</td></tr>'}</tbody></table>
		`;

		// Modifications / Enchantments / Legendaries
		const customEntries = Object.keys(state.craftList).sort().flatMap(n => {
			const custom = state.customizations[n];
			if (!custom) return [];
			const qty = state.craftList[n];
			const item = ITEMS[n];
			const rows = [];
			(custom.mods||[]).filter(Boolean).forEach(modName => {
				const modCost = mergeIngredientLists(item.modIngredients, MODIFICATIONS[modName]?MODIFICATIONS[modName].cost:[]);
				rows.push({item:n, qty, kind:'Modification', name:modName, cost:modCost});
			});

			if (custom.enchant) {
				rows.push({item:n, qty, kind:'Enchantment', name:custom.enchant, cost:ENCHANTMENTS[custom.enchant]?ENCHANTMENTS[custom.enchant].cost:[]});
			}

			if (custom.legendary) {
				rows.push({item:n, qty, kind:'Legendary', name:custom.legendary, cost:LEGENDARY_EFFECTS[custom.legendary]?LEGENDARY_EFFECTS[custom.legendary].cost:[]});
			}

			return rows;
		});

		if (customEntries.length) {
			const kindIncluded = {Modification: toggles.includeMods, Enchantment: toggles.includeEnchant, Legendary: toggles.includeLegendary};
			const customRows = customEntries.map(r => {
				const costStr = r.cost.length ? r.cost.map(c => `${escapeHtml(c.name)} x${c.qty}`).join(', ') : '-';
				const included = kindIncluded[r.kind];
				const excludedTag = included ? '' : ' <span class="tag">excluded</span>';
				return `<tr${included?'':' style="opacity: .55;"'}><td class="row-name">${escapeHtml(r.item)}</td><td>${escapeHtml(r.kind)}${excludedTag}</td><td>${escapeHtml(r.name)}</td><td>${r.qty}</td><td>${costStr}</td></tr>`;
			}).join('');

			html += `
				<h3>Modifications, Enchantments, &amp; Legendary Effects</h3>
				<table><thead><tr><th>Item</th><th>Type</th><th>Name</th><th>Quantity</th><th>Cost</th></tr></thead>
				<tbody>${customRows}</tbody></table>
			`;
		}
	}

	if (Object.keys(state.repairList).length) {
		const repairPerItemNames = Object.keys(state.repairList).filter(n => state.repairList[n] > 0 && ITEMS[n]).sort();
		const repairPerItemRows = repairPerItemNames.map(n => {
			const item = ITEMS[n];
			const times = state.repairList[n];
			const ingredientBits = item.repairIngredients.map(ing => `${escapeHtml(ing.name)} x${ing.qty * times}`).join(', ') || '-';
			return `<tr><td class="row-name">${escapeHtml(n)}</td><td>${times}</td><td>${ingredientBits}</td></tr>`;
		}).join('');

		html += `
			<h3>Repair Costs</h3>
			<table><thead><tr><th>Item</th><th>Times</th><th>Cost</th></tr></thead>
			<tbody>${repairPerItemRows || '<tr><td colspan="3" class="list-empty">Nothing in the repair list.</td></tr>'}</tbody></table>
		`;
	}

	const anySectionShown = Object.keys(rawNeeded).length || Object.keys(state.craftList).length ||
		Object.keys(customRawNeeded).length || Object.keys(state.repairList).length;

	if (anySectionShown) {
		const totalForCrafting = {};
		[grossRawNeeded, grossCustomRawNeeded, grossRepairRawNeeded].forEach(bucket => {
			Object.keys(bucket).forEach(n => {
				totalForCrafting[n] = (totalForCrafting[n] || 0) + bucket[n];
			});
		});

		const totalForCraftingNames = Object.keys(totalForCrafting).sort();
		const totalForCraftingRows = totalForCraftingNames.map(n =>
			`<tr><td class="row-name">${escapeHtml(n)}</td><td>${totalForCrafting[n]}</td></tr>`
		).join('') || '<tr><td colspan="2" class="list-empty">Nothing needed!</td></tr>';

		html += `
			<h3>Total Cost</h3>
			<table><thead><tr><th>Item</th><th>Quantity</th></tr></thead>
			<tbody>${totalForCraftingRows}</tbody></table>
		`;

		const grandTotal = {};
		[rawNeeded, customRawNeeded, repairRawNeeded].forEach(bucket => {
			Object.keys(bucket).forEach(n => {
				grandTotal[n] = (grandTotal[n] || 0) + bucket[n];
			});
		});

		const grandNames = Object.keys(grandTotal).sort();
		const grandRows = grandNames.map(n => 
			`<tr><td class="row-name">${escapeHtml(n)}</td><td>${grandTotal[n]}</td></tr>`
		).join('') || '<tr><td colspan="2" class="list-empty">Nothing needed!</td></tr>';

		html += `
			<h3>Items Missing</h3>
			<table><thead><tr><th>Item</th><th>Quantity</th></tr></thead>
			<tbody>${grandRows}</tbody></table>
		`;
	}

	resultsEl.innerHTML = `<div class="result-section">${html}</div>`;
}

/* ---------- Export / Import EVERYTHING (inventory, craft list, repair list, Desired Gear) ---------- */
function cleanCustomForItem(item, raw) {
	if (!raw || typeof raw !== 'object') return {mods: [], enchant: null, legendary: null};
	const slots = modSlotsForItem(item);
	const validModNames = new Set(applicableEntries(MODIFICATIONS, item).map(m => m.name));
	const validEnchantNames = new Set(applicableEntries(ENCHANTMENTS, item).map(m => m.name));
	const validLegendaryNames = isMasterwork(item) ? new Set(applicableEntries(LEGENDARY_EFFECTS, item).map(m => m.name)) : new Set();
	const mods = Array.isArray(raw.mods) ? raw.mods.filter(m  => typeof m === 'string' && validModNames.has(m)).slice(0, slots) : [];
	const enchant = (typeof raw.enchant === 'string' && validEnchantNames.has(raw.enchant)) ? raw.enchant : null;
	const legendary = (typeof raw.legendary === 'string' && validLegendaryNames.has(raw.legendary)) ? raw.legendary : null;
	return {mods, enchant, legendary};
}

document.getElementById('exportAllBtn').addEventListener('click', () => {
	const hasAnything = Object.keys(state.inventory).length || Object.keys(state.craftList).length || Object.keys(state.repairList).length || state.favorites.length;
	if (!hasAnything) {
		alert('Nothing to export yet - add some items first.');
		return;
	}

	const customizations = {};
	Object.keys(state.customizations).forEach(n => {
		const c = state.customizations[n];
		const mods = (c.mods || []).filter(Boolean);
		if (mods.length || c.enchant || c.legendary) {
			customizations[n] = {mods, enchant: c.enchant || null, legendary: c.legendary || null};
		}
	});

	const favorites = state.favorites.map(entry => {
		const c = state.favCustomizations[entry.id] || {};
		const mods = (c.mods||[]).filter(Boolean);
		return {name: entry.name, mods, enchant: c.enchant || null, legendary: c.legendary || null};
	});

	const payload = {
		type:		'crafting-calc-full-backup',
		version:	1,
		exportedAt:	new Date().toISOString(),
		inventory:	{...state.inventory},
		craftList:	{...state.craftList},
		repairList:	{...state.repairList},
		customizations,
		favorites
	};
	const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	a.href = url;
	a.download = 'crafting-calc-full-backup.json';
	document.body.appendChild(a);
	a.click();
	document.body.removeChild(a);
	URL.revokeObjectURL(url);
});

document.getElementById('importAllBtn').addEventListener('click', () => {
	document.getElementById('importAllFile').click();
});

document.getElementById('importAllFile').addEventListener('change', e => {
	const file = e.target.files[0];
	if(!file) return;
	const reader = new FileReader();
	reader.onload = ()  =>  {
		let parsed;
		try {
			parsed = JSON.parse(reader.result);
		} catch(err) {
			alert('File is not valid JSON.');
			e.target.value='';
			return;
		}

		if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
			alert('File doesn\'t look like a proper export.');
			e.target.value='';
			return;
		}

		// Inventory
		const cleanInventory = {};
		if (parsed.inventory && typeof parsed.inventory === 'object') {
			Object.entries(parsed.inventory).forEach(([name, qty]) => {
				if ((MATERIALS[name] || ITEMS[name]) && typeof qty === 'number' && qty > 0) {
					cleanInventory[name] = Math.floor(qty);
				}
			});
		}

		// Craft
		const cleanCraftList = {};
		if (parsed.craftList && typeof parsed.craftList === 'object') {
			Object.entries(parsed.craftList).forEach(([name, qty]) => {
				if (ITEMS[name] && typeof qty === 'number' && qty > 0) cleanCraftList[name] = Math.floor(qty);
			});
		}

		// Repair
		const cleanRepairList = {};
		if (parsed.repairList && typeof parsed.repairList === 'object') {
			Object.entries(parsed.repairList).forEach(([name, qty]) => {
				if (ITEMS[name] && typeof qty === 'number' && qty > 0) cleanRepairList[name] = Math.floor(qty);
			});
		}

		// Customizations
		const cleanCustomizations = {};
		if (parsed.customizations && typeof parsed.customizations === 'object') {
			Object.entries(parsed.customizations).forEach(([name, raw]) => {
				const item = ITEMS[name];
				if (!item) return;
				const c = cleanCustomForItem(item, raw);
				if (c.mods.length || c.enchant || c.legendary) cleanCustomizations[name] = c;
			});
		}

		// Desired
		const cleanFavorites = [];
		if (Array.isArray(parsed.favorites)) {
			parsed.favorites.forEach(entry => {
				const name = typeof entry === 'string' ? entry : (entry && entry.name);
				if (typeof name !== 'string' || !ITEMS[name]) return;
				const item = ITEMS[name];
				const c = cleanCustomForItem(item, typeof entry === 'object' ? entry : {});
				cleanFavorites.push({id: genId(), name, ...c});
			});
		}

		const totalCount = Object.keys(cleanInventory).length + Object.keys(cleanCraftList).length + Object.keys(cleanRepairList).length + cleanFavorites.length;
		if (!totalCount) {
			alert('No recognizable data found in that file.');
			e.target.value='';
			return;
		}

		const merge = confirm(
			`Found: ${Object.keys(cleanInventory).length} inventory item(s), ${Object.keys(cleanCraftList).length} craft list item(s), ` +
			`${Object.keys(cleanRepairList).length} repair list item(s), ${cleanFavorites.length} Desired Gear item(s).\n\n` +
			`Click OK to MERGE with what you currently have, or Cancel to REPLACE everything entirely.`
		);

		if (!merge) {
			state.inventory			= {};
			state.craftList			= {};
			state.repairList		= {};
			state.favorites			= [];
			state.favCustomizations	= {};
			state.customizations	= {};
			state.invCustomizations	= {};
		}

		Object.entries(cleanInventory).forEach(([n,q]) => {
			state.inventory[n] = (state.inventory[n] || 0) + q;
		});

		Object.entries(cleanCraftList).forEach(([n,q]) => {
			state.craftList[n] = (state.craftList[n] || 0) + q;
		});

		Object.entries(cleanRepairList).forEach(([n,q]) => {
			if ((state.inventory[n] || 0) > 0) state.repairList[n] = (state.repairList[n] || 0) + q;
		});

		Object.entries(cleanCustomizations).forEach(([n,c]) => {
			state.customizations[n] = c;
		});

		cleanFavorites.forEach(f => {
			state.favorites.push({id: f.id, name: f.name});
			if (f.mods.length || f.enchant || f.legendary) {
				state.favCustomizations[f.id] = {mods: f.mods, enchant: f.enchant, legendary: f.legendary};
			}
		});

		saveState();
		renderInventory();
		renderCraftList();
		renderRepairList();
		renderFavorites();
		renderQuickStats();
		refreshRepairSelect();
		e.target.value = '';
	};

	reader.readAsText(file);
});



/* ---------- Init ---------- */
renderInventory();
renderCraftList();
renderRepairList();
renderFavorites();
renderQuickStats();
</script>
